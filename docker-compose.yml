services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gravimetry-ml:dev
    container_name: gravimetry-ml-app
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8888:8888"
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
